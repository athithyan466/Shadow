{% extends 'base.html' %}{% block content %}<div class="narrow"><a class="text-link" href="{{ url_for('dashboard') }}">← Dashboard</a><div class="eyebrow">NEW ASSESSMENT</div><h1>Create a test</h1><form method="post" class="panel form-stack"><label>Test title<input name="title" required placeholder="e.g. Python fundamentals assessment"></label><label>Description<textarea name="description" rows="3" placeholder="Instructions or topic details"></textarea></label><div class="two-col"><label>Duration (minutes)<input type="number" name="duration" min="1" max="600" value="30" required></label><label>Attempts per candidate<input type="number" name="max_attempts" min="1" max="100" value="1" required></label></div><button class="btn primary">Create and add questions</button></form></div>{% endblock %}
