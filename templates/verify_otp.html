{% extends 'base.html' %}{% block content %}
<div class="auth-card">
  <div class="eyebrow">EMAIL VERIFICATION</div>
  <h1>Enter your code</h1>
  <p>We sent a one-time code to <strong>{{ email }}</strong>.</p>
  <form method="post">
    <label>One-time code</label
    ><input
      name="otp"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="Enter code"
      required
    /><button class="btn primary full">Verify and continue</button>
  </form>
  <a class="text-link" href="{{ url_for('login') }}">Use another email</a>
</div>
{% endblock %}
